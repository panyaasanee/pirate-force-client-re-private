name: pirate-force-re-runner-cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: pirate-force-re-runner-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check activation and secrets
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PF_BRIDGE_TOKEN: ${{ secrets.PF_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          enabled=$(tr -d '[:space:]' < cloud/runner_enabled)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$enabled" != "true" ]; then
            echo "Cloud runner is disabled; scheduled run is a no-op."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$PF_BRIDGE_TOKEN" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::OPENAI_API_KEY and PF_BRIDGE_TOKEN must both be configured."
              exit 1
            fi
            echo "Secrets are not configured; scheduled run is a no-op."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  analyze:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      final_json: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Check out client image and runner
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out bridge
        uses: actions/checkout@v5
        with:
          repository: panyaasanee/pf_bridge
          path: sources/pf_bridge
          persist-credentials: false

      - name: Check out server
        uses: actions/checkout@v5
        with:
          repository: panyaasanee/pirate-force-server
          path: sources/pirate-force-server
          persist-credentials: false

      - name: Prepare verified static-analysis inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pefile capstone
          mkdir -p work
          python tools/analyze_pilot.py client/GameClient.bin > work/image_manifest_actual.json
          jq -e '.sha256 == "C528BF43070E2789170F41B6E3E28CCEC6B57BDC594EE73DFA061188A5D1E4BD" and .size_bytes == 14759424' work/image_manifest_actual.json
          python tools/build_protocol_compat.py \
            --legacy registry/VITAL_REGISTRY_FROM_CLIENT_BINARY_20260817.tsv \
            --protocol sources/pf_bridge/external/PF_PROTOCOL_REGISTRY.tsv \
            --output work/PF_PROTOCOL_REGISTRY_COMPAT.tsv \
            --verify-pilot-snapshot \
            > work/protocol_compat_summary.json
          if [ -f inputs/PF_RE_CLOUD_SCENES_20260826.zip ]; then
            echo "7e9ef01e12e12b1121774f8d5bc02a9a1fd20aef42267ac9d33fa50eb47126ec  inputs/PF_RE_CLOUD_SCENES_20260826.zip" | sha256sum --check --strict
            mkdir -p work/scene_inputs
            python -m zipfile -e inputs/PF_RE_CLOUD_SCENES_20260826.zip work/scene_inputs
            test "$(find work/scene_inputs -type f | wc -l)" -eq 60
            test -f work/scene_inputs/FilmScene/filmscene.npc
            test -f work/scene_inputs/Bg1181/Bg1181.npc
            test -f work/scene_inputs/Bg2033/Bg2033.npc
            test -f work/scene_inputs/bg0001/bg0001.npc
            chmod -R a-w work/scene_inputs
          fi
          chmod -R a-w client manifest registry tools sources
          if [ -d inputs ]; then chmod -R a-w inputs; fi

      - name: Run one static RE ticket
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pirate-force-re-runner.md
          model: gpt-5.6-sol
          effort: xhigh
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-schema-file: .github/codex/re_runner_output.schema.json
          codex-args: '["--ephemeral"]'

  publish:
    needs: [preflight, analyze]
    if: needs.preflight.outputs.ready == 'true' && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate result and publish at most one letter
        uses: actions/github-script@v7
        env:
          RESULT_JSON: ${{ needs.analyze.outputs.final_json }}
        with:
          github-token: ${{ secrets.PF_BRIDGE_TOKEN }}
          script: |
            const crypto = require('crypto');
            const owner = 'panyaasanee';
            const repo = 'pf_bridge';
            const branch = 'main';
            const data = JSON.parse(process.env.RESULT_JSON || '');
            const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');

            if (!['NO_WORK', 'RESULT'].includes(data.status)) {
              throw new Error(`invalid status ${data.status}`);
            }
            if (!Array.isArray(data.input_hashes) || data.input_hashes.some((row) => !row.identical || row.before_sha256 !== row.after_sha256)) {
              throw new Error('one or more relied-on input hashes changed');
            }
            await core.summary.addHeading('Pirate Force RE runner').addCodeBlock(data.log_line || '').write();

            if (data.status === 'NO_WORK') {
              if (data.ticket_id || data.letter_name || data.letter_content || data.letter_sha256) {
                throw new Error('NO_WORK must not contain a result letter');
              }
              core.notice(data.log_line);
              return;
            }

            if (!/^(RE|GT)-\d{3}$/.test(data.ticket_id)) {
              throw new Error(`invalid ticket id ${data.ticket_id}`);
            }
            const escapedTicket = data.ticket_id.replace('-', '\\-');
            const filePattern = new RegExp(`^\\d{8}_\\d{4}_${escapedTicket}-RESULT-[A-Za-z0-9._-]+\\.md$`);
            if (!filePattern.test(data.letter_name)) {
              throw new Error(`invalid result filename ${data.letter_name}`);
            }
            if (!data.letter_content.startsWith('ถึง:') && !data.letter_content.startsWith('To:')) {
              throw new Error('letter must address chief on its first line');
            }
            if (!/ค้น[^\n]*external[^\n]*แล้ว:/u.test(data.letter_content) || !/ค้น gamedata แล้ว:/u.test(data.letter_content)) {
              throw new Error('mandatory external/gamedata search lines are missing');
            }
            if (!data.letter_content.includes('BUILD_IMPACT:')) {
              throw new Error('BUILD_IMPACT is missing');
            }
            if (sha256(Buffer.from(data.letter_content, 'utf8')) !== data.letter_sha256) {
              throw new Error('letter SHA-256 does not match content');
            }

            const queue = await github.rest.repos.getContent({owner, repo, path: 'CLIENT_RE_QUEUE.md', ref: branch});
            if (Array.isArray(queue.data) || !queue.data.content) {
              throw new Error('CLIENT_RE_QUEUE.md was not returned as a file');
            }
            const queueBytes = Buffer.from(queue.data.content.replace(/\n/g, ''), 'base64');
            if (sha256(queueBytes) !== data.queue_sha256) {
              throw new Error('queue changed after analysis; refusing to publish stale result');
            }

            const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            const commit = await github.rest.git.getCommit({owner, repo, commit_sha: ref.data.object.sha});
            const tree = await github.rest.git.getTree({owner, repo, tree_sha: commit.data.tree.sha, recursive: 'true'});
            const resultPaths = (tree.data.tree || [])
              .map((entry) => entry.path || '')
              .filter((path) => path.startsWith('notes_to_chief/') && path.includes(data.ticket_id) && path.includes('RESULT'));
            if (resultPaths.length && !data.reopened_after_result) {
              throw new Error(`result already exists: ${resultPaths.join(', ')}`);
            }

            const path = `notes_to_chief/${data.letter_name}`;
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `re-runner: ${data.ticket_id} ${data.result_kind}`,
              content: Buffer.from(data.letter_content, 'utf8').toString('base64'),
            });
            core.notice(`Published ${path}`);
